[grommunio-web-pool]
; socket information
listen = /run/php-fpm/php-grommunio-web-fpm.sock
listen.mode = 0666
listen.owner = groweb
listen.group = groweb
listen.backlog = -1
; process privileges
user = groweb
group = groweb
; process management
pm = dynamic
pm.max_children = 250
pm.start_servers = 8
pm.min_spare_servers = 8
pm.max_spare_servers = 16
; additional tunables
request_terminate_timeout = 120s
php_admin_value[memory_limit] = 512M
rlimit_files = 131072
rlimit_core = unlimited
; logging
catch_workers_output = yes
