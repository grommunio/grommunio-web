# Licence and copyright for the files that cannot carry an SPDX header
# themselves: the third-party trees vendored into this repository, and our own
# binary or comment-less files (images, fonts, audio, gettext catalogs, JSON).
#
# Every other file states its licence in its own header. Together the two cover
# the whole repository, so `reuse lint` passes.
#
# The vendored entries here and the runtime half of bom.json describe the same
# components; regenerate the BOMs with `make bom` after changing either.

version = 1
SPDX-PackageName = "grommunio-web"
SPDX-PackageSupplier = "grommunio GmbH <info@grommunio.com>"
SPDX-PackageDownloadLocation = "https://github.com/grommunio/grommunio-web"

# ── our own files ───────────────────────────────────────────────────

[[annotations]]
path = [
  "server/language/**",
  "client/resources/images/**",
  "client/resources/audio/**",
  "client/resources/css/**",
  "doc/**",
  "README.rst",
  "SECURITY.md",
  "manifest.webmanifest",
  "version",
  "package.json",
  "package-lock.json",
  "bom.json",
  "bom.spdx.json",
  "tools/bom-vendored.json",
  "REUSE.toml",
  ".gitignore",
  ".browserslistrc",
  ".htaccess",
  "client/jsduck.json",
  "plugins/*/README.md",
  "plugins/*/docs/**",
  "plugins/pgp/js/crypto/README.md",
  "plugins/*/.gitignore",
  "plugins/*/resources/**",
  "plugins/*/system-templates-samples/**",
  "plugins/files/js/ui/**",
  "server/**/*.dirstamp",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2020 - 2026 grommunio GmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["plugins/pgp/resources/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright (c) the OpenPGP.js contributors",
  "Copyright (c) 2022 - 2023 Paul Miller (noble-ciphers, noble-hashes, noble-curves)",
  "Copyright (c) 2021 - 2025 Andris Reinman (postal-mime)",
  "Copyright (c) 2026 Arjun Barrett (fflate)",
]
SPDX-License-Identifier = "LGPL-3.0-or-later AND MIT-0 AND MIT"

# Upstream style sheets and marker images of the maps plugin.
[[annotations]]
path = [
  "plugins/maps/resources/css/leaflet.css",
  "plugins/maps/resources/css/images/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2010 - 2023 Vladimir Agafonkin, (c) 2010 - 2011 CloudMade"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["plugins/maps/resources/css/geocoder.css"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2010 - 2016 Stephan Meijer (leaflet-geosearch)"
SPDX-License-Identifier = "MIT"

# Files that cannot host a comment where a header would be valid: the two
# templates that open with a doctype rather than <?php, dependency manifests,
# a dotfile, and a test fixture.
[[annotations]]
path = [
  "server/includes/templates/deskapp.php",
  "server/includes/templates/login.php",
  "plugins/*/php/composer.json",
  "plugins/*/php/composer.lock",
  "plugins/*/php/.htaccess",
  "plugins/*/package.json",
  "plugins/*/package-lock.json",
  "plugins/*/test/*.crt",
  "tools/README.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2020 - 2026 grommunio GmbH"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The licence texts themselves carry no licence of their own.
[[annotations]]
path = ["LICENSE.txt", "AGPL-3"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright 2020 - 2026 grommunio GmbH",
  "Copyright 2016 Kopano and its licensors",
  "Copyright 2005 - 2016 Zarafa B.V. and its licensors",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

